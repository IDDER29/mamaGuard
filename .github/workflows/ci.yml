name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Triage vignettes
        run: npm run test:triage

      - name: Triage safety gate (no under-triage)
        run: npm run test:safety

      - name: Conversation parser tests
        run: npm run test:conversation

      - name: Build
        run: npm run build
        env:
          # Dummy public values so the build never depends on real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
